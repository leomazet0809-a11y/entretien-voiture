<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entretien voiture</title>
<meta name="theme-color" content="#F6F6F3">
<meta name="description" content="Suivi des entretiens, du kilométrage et des factures de vos voitures.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="icones/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icones/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Entretien">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // Applique le thème mémorisé avant l'affichage, pour éviter un flash de la mauvaise couleur.
  try {
    var themeMemorise = localStorage.getItem('entretien-voiture.theme');
    if (themeMemorise === 'light' || themeMemorise === 'dark') document.documentElement.setAttribute('data-theme', themeMemorise);
  } catch (e) { /* stockage indisponible : on suit l'appareil */ }
</script>
</head>
<body>
<header class="barre">
  <div class="barre-interne">
    <a class="marque" href="#" aria-label="Entretien voiture, retour à mes voitures">
      <span class="marque-logo" data-icone="cle" aria-hidden="true"></span>
      <span class="marque-nom">Entretien voiture</span>
    </a>

    <div class="actions">
      <button class="bouton bouton-icone" id="bouton-theme" type="button" aria-label="Changer de thème"></button>
      <a class="bouton bouton-icone" id="lien-parametres" href="#parametres" aria-label="Paramètres" title="Paramètres">
        <span data-icone="reglages" aria-hidden="true"></span>
      </a>
    </div>
  </div>
</header>

<div class="alerte-zone" id="alerte-stockage" hidden>
  <p class="alerte" role="alert">
    <span data-icone="alerte" aria-hidden="true"></span>
    <span>Ce navigateur ne permet pas d'enregistrer les données : tout ce que vous saisissez sera perdu en fermant la page. Évitez la navigation privée.</span>
  </p>
</div>

<main id="contenu" class="contenu" tabindex="-1"></main>

<div class="messages" id="messages" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/ui.js"></script>
<script src="js/installation.js"></script>
<script src="js/format.js"></script>
<script src="js/theme.js"></script>
<script src="js/routeur.js"></script>
<script src="js/compte.js"></script>
<script src="js/stockage.js"></script>
<script src="js/voitures.js"></script>
<script src="js/categories.js"></script>
<script src="js/evenements.js"></script>
<script src="js/documents.js"></script>
<script src="js/kilometrage.js"></script>
<script src="js/graphique.js"></script>
<script src="js/recherche.js"></script>
<script src="js/csv.js"></script>
<script src="js/echange.js"></script>
<script src="js/ecrans/fenetre-voiture.js"></script>
<script src="js/ecrans/fenetre-evenement.js"></script>
<script src="js/ecrans/fenetre-releve.js"></script>
<script src="js/ecrans/accueil.js"></script>
<script src="js/ecrans/voiture.js"></script>
<script src="js/ecrans/parametres.js"></script>
<script src="js/ecrans/recherche.js"></script>
<script src="js/ecrans/echange-csv.js"></script>
<script src="js/app.js"></script>
</body>
</html>
